<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIPAT — Scan. Score. See what to reteach.</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17233A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F5F1E8;--card:#FFFDF8;--ink:#17233A;--muted:#6B7385;--line:#E2DCCD;--red:#D4452F;--green:#1F8A5B;--amber:#C98A0B;--soft:#EEE8DA}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;
  background-image:radial-gradient(rgba(23,35,58,.07) 1.6px,transparent 2.2px);background-size:22px 22px}
h1,h2,h3,.brand b{font-family:'Fraunces',Georgia,serif;letter-spacing:-.01em;margin:0}
h2{font-size:26px} h3{font-size:18px;margin-bottom:10px}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(100deg,#17233A 0%,#22355A 100%);border-bottom:3px solid var(--red);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;margin-right:auto}
.brand b{font-size:24px;letter-spacing:.06em}
.brand small{display:block;font-size:11px;opacity:.75;margin-top:-4px}
.top nav button{background:none;border:0;color:#fff;opacity:.75;font:600 14px 'Plus Jakarta Sans';padding:8px 10px;cursor:pointer;border-bottom:2px solid transparent}
.top nav button.on{opacity:1;border-color:var(--red)}
main{max-width:1080px;margin:0 auto;padding:22px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 0 rgba(23,35,58,.04)}
.hero{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.hero h1{font-size:40px;line-height:1.05}
.hero h1 em{font-style:normal;color:var(--red)}
.hero p{color:var(--muted);margin:6px 0 0;max-width:520px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);background:var(--card);color:var(--ink);font:600 14px 'Plus Jakarta Sans';padding:9px 14px;border-radius:10px;cursor:pointer}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.exam{cursor:pointer;transition:transform .12s}
.exam:hover{transform:translateY(-2px);border-color:var(--ink)}
.exam .meta,.muted{color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--soft)}
.pill.r{background:#FBE3DE;color:var(--red)} .pill.g{background:#DDF1E7;color:var(--green)} .pill.a{background:#F8EBCB;color:#8a5f00}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:-1px}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.keygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 18px}
.keyrow{display:flex;align-items:center;gap:4px}
.keyrow span{width:26px;text-align:right;font-weight:700;font-size:13px;color:var(--muted)}
.bub{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;font:600 12px 'Plus Jakarta Sans';cursor:pointer;padding:0}
.bub.on{background:var(--ink);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--soft);font-size:12px}
td.c,th.c{text-align:center}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:14px 0}
.tabs button{background:none;border:0;font:600 14px 'Plus Jakarta Sans';padding:9px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--ink);border-color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--soft);border-radius:12px;padding:10px 12px}
.stat b{display:block;font:700 24px 'Fraunces',serif}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--soft);border-radius:9px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%}
#camBox{display:none;position:relative;background:#000;border-radius:14px;overflow:hidden;max-width:520px;margin:12px auto}
#camBox.on{display:block}
#camBox video{width:100%;display:block}
#camBox .frame{position:absolute;inset:5%;border:2px dashed rgba(255,255,255,.7);border-radius:8px;pointer-events:none}
#camStatus{position:absolute;left:0;right:0;bottom:0;background:rgba(23,35,58,.85);color:#fff;font-size:13px;padding:7px 12px;text-align:center}
#review canvas{max-width:100%;border-radius:10px;border:1px solid var(--line)}
.rev{display:grid;gap:16px;grid-template-columns:minmax(220px,360px) 1fr}
@media(max-width:720px){.rev{grid-template-columns:1fr}.hero h1{font-size:32px}}
.big{font:700 44px 'Fraunces',serif;line-height:1}
.ans{display:flex;flex-wrap:wrap;gap:4px}
.ans button{border:1px solid var(--line);background:#fff;border-radius:7px;font:600 12px 'Plus Jakarta Sans';padding:3px 6px;min-width:44px;cursor:pointer}
.ans button.ok{background:#DDF1E7;border-color:#9fd3bb} .ans button.no{background:#FBE3DE;border-color:#efb1a6}
.lead{background:linear-gradient(135deg,#17233A 0%,#243a63 100%);color:#fff;border-radius:22px;padding:26px 28px;display:grid;grid-template-columns:1.15fr 1fr;gap:12px;align-items:center;position:relative;overflow:hidden;margin-bottom:16px;box-shadow:0 14px 30px -18px rgba(23,35,58,.6)}
.lead:before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.07) 5px,transparent 6px);background-size:26px 26px;pointer-events:none}
.lead>*{position:relative}
.lead .kick{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;background:rgba(255,255,255,.14);padding:4px 10px;border-radius:99px;margin-bottom:10px}
.lead h1{font-size:42px;line-height:1.04} .lead h1 em{font-style:normal;color:#FF8A73}
.lead p{color:rgba(255,255,255,.82);margin:10px 0 16px;max-width:460px}
.lead .art{width:100%;max-height:250px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:flex-start}
.step .ic,.banner .ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff}
.step b{display:block;font-size:14px} .step span{font-size:12px;color:var(--muted);line-height:1.35;display:block}
.sech{display:flex;align-items:center;gap:10px;margin:0 0 12px} .sech h2{font-size:22px} .sech i{flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 14px)}
.exam{padding:0;overflow:hidden;display:flex;flex-direction:column}
.exam .band{background-color:var(--tone);background-image:radial-gradient(circle,rgba(255,255,255,.2) 4px,transparent 5px);background-size:18px 18px;color:#fff;padding:9px 16px;font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.exam .in{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column}
.exam .facts{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);margin:8px 0 12px}
.exam .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}
.exam:hover{box-shadow:0 12px 24px -16px rgba(23,35,58,.55)}
.xhead{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--tone);border-radius:14px;padding:16px 18px;margin-bottom:0}
.xhead .pill{background:var(--tone);color:#fff}
.banner{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:16px}
.banner .ic{width:52px;height:52px;border-radius:16px} .banner p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.empty{text-align:center;padding:26px 18px} .empty svg{width:120px;height:auto;margin-bottom:6px} .empty p{max-width:420px;margin:6px auto 0}
.stat{border-top:3px solid var(--ink)} .stat:nth-child(4n+2){border-color:var(--red)} .stat:nth-child(4n+3){border-color:var(--green)} .stat:nth-child(4n+4){border-color:var(--amber)}
.card h3{display:flex;align-items:center;gap:8px}
.two{display:grid;gap:12px;grid-template-columns:minmax(200px,280px) 1fr}
@media(max-width:760px){.lead{grid-template-columns:1fr;padding:22px 20px}.lead h1{font-size:34px}.lead .art{max-height:190px}.steps{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}
@media print{.lead,.steps{display:none}}
#syncPill{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:99px;font:600 12px 'Plus Jakarta Sans',system-ui,sans-serif;padding:7px 12px;cursor:pointer;white-space:nowrap}
#syncPill.warn{background:var(--amber)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;max-width:90vw}
#toast.on{opacity:1} #toast.err{background:var(--red)}
[contenteditable]{outline:0;background:#FFFBEA} [contenteditable]:focus{box-shadow:inset 0 0 0 2px var(--amber)}
.sign{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:26px 20px;margin-top:26px}
.sign div p{margin:0;font-size:12px;color:var(--muted)}
.sign div b{display:block;margin-top:30px;border-bottom:1px solid var(--ink);text-transform:uppercase;font-size:13px;min-height:21px}
.rhead{text-align:center;display:none;margin-bottom:12px;font-size:12px;line-height:1.35}
.rhead b{font-size:14px}
#printArea{display:none}
@media print{
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea .rhead{display:block}
  #printArea .noprint{display:none!important}
  #printArea .card{border:0;padding:0;box-shadow:none;margin-bottom:10px;background:#fff}
  #printArea table{font-size:10.5px} #printArea th,#printArea td{border-color:#555;padding:3px 5px}
  #printArea [contenteditable]{background:none}
  #printArea h3{font-size:14px;margin:10px 0 5px} .stat{border:1px solid #999;background:#fff}
  .sign div{break-inside:avoid} tr{break-inside:avoid}
  #printArea svg.sheet{width:210mm;height:296mm;display:block}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand" onclick="home()">
    <svg width="38" height="38" viewBox="0 0 38 38"><circle cx="19" cy="19" r="15" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M11 19.5l6 6L30 9" fill="none" stroke="#D4452F" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><b>SIPAT</b><small>Scan. Score. See what to reteach.</small></div>
  </div>
  <nav>
    <button id="nav-home" onclick="home()">Exams</button>
    <button id="nav-classes" onclick="classes()">Classes</button>
    <button id="nav-settings" onclick="settings()">Settings</button>
  </nav>
  <button id="syncPill" onclick="sync(true)" title="Tap to sync now">…</button>
</header>
<main id="main"></main>
<div id="toast"></div>
<div id="printArea"></div>

<script>
/* ============================== SIPAT client ============================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LET='ABCDE';
let S={settings:{},exams:[],counts:{},roster:{},results:[],tab:'scan',fsec:'',review:null};
let E=null;   // exam currently open
let D=null;   // exam draft being edited

function toast(m,err){const t=$('#toast');t.textContent=m;t.className='on'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',err?5000:2600);}
/* ---------------------- Offline store + sync ---------------------- */
const DB_KEY='sipat.v1';
const DEF={region:'',division:'',school:'Samal Senior High School',schoolYear:'',masterTeachers:'',masterTeacherTitle:'Master Teacher',coordinator:'',coordinatorTitle:'School Testing Coordinator',principal:'',principalTitle:'School Principal'};
let DB=null,syncing=false,syncT=null;
function loadDB(){
  let d=null;try{d=JSON.parse(localStorage.getItem(DB_KEY));}catch(e){}
  d=d||{};d.settings=Object.assign({},DEF,d.settings);d.exams=d.exams||[];d.results=d.results||[];d.classes=d.classes||[];
  d.sync=Object.assign({url:'',code:'',last:0},d.sync);return d;
}
function persist(noSync){
  try{localStorage.setItem(DB_KEY,JSON.stringify(DB));}catch(e){toast('This phone is out of storage for SIPAT. Sync, then delete old exams.',1);}
  refresh();paintSync();if(!noSync)syncSoon();
}
function touch(r){r.updated=Date.now();r.dirty=1;return r;}
function newId(p){return p+Date.now().toString(36).toUpperCase()+Math.floor(Math.random()*1296).toString(36).toUpperCase();}
function stampNow(){const d=new Date(),z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes());}
function refresh(){
  S.settings=DB.settings;S.exams=DB.exams.filter(x=>!x.deleted);
  S.roster={};DB.classes.forEach(c=>{if(!c.deleted)S.roster[c.section]=(c.names||[]).map((n,i)=>({no:i+1,name:n}));});
  S.counts={};DB.results.forEach(r=>{if(!r.deleted)S.counts[r.examId]=(S.counts[r.examId]||0)+1;});
  if(E){E=S.exams.find(x=>x.id===E.id)||E;S.results=DB.results.filter(r=>r.examId===E.id&&!r.deleted);}
}
function pending(){return DB.exams.concat(DB.results,DB.classes).filter(r=>r.dirty).length+(DB.settings.dirty?1:0);}
function paintSync(){
  const p=$('#syncPill');if(!p)return;const n=pending();let t,w=false;
  if(syncing)t='Syncing…';
  else if(!navigator.onLine){t='Offline'+(n?' · '+n+' to upload':'');w=n>0;}
  else if(!DB.sync.url){t='Not linked';w=true;}
  else if(n){t=n+' to upload';w=true;}
  else t='Synced ✓';
  p.textContent=t;p.className=w?'warn':'';
}
function syncSoon(){clearTimeout(syncT);syncT=setTimeout(()=>sync(false),1500);}
async function post(body){
  body.code=DB.sync.code;
  const res=await fetch(DB.sync.url,{method:'POST',body:JSON.stringify(body),redirect:'follow'});
  const j=await res.json();if(!j.ok)throw new Error(j.error||'The Google Sheet did not accept the data.');return j;
}
async function sync(manual){
  if(syncing)return;
  if(!DB.sync.url){if(manual){settings();toast('Paste your school\'s sync link here first.',1);}return;}
  if(!navigator.onLine){if(manual)toast('No internet right now. Everything is saved on this phone and will upload once you are connected.');return;}
  syncing=true;paintSync();const stamp=Date.now(),d=r=>r.dirty;
  try{
    const j=await post({action:'sync',exams:DB.exams.filter(d),results:DB.results.filter(d),classes:DB.classes.filter(d),settings:DB.settings.dirty?DB.settings:null});
    const merge=(loc,srv,key)=>{const m=new Map(srv.map(r=>[r[key],r]));loc.forEach(r=>{if(r.dirty&&r.updated>stamp)m.set(r[key],r);});return [...m.values()];};
    DB.exams=merge(DB.exams,j.exams,'id');DB.results=merge(DB.results,j.results,'id');DB.classes=merge(DB.classes,j.classes,'section');
    if(DB.settings.dirty&&DB.settings.updated>stamp){}else if(j.settings)DB.settings=Object.assign({},DEF,j.settings);else delete DB.settings.dirty;
    DB.sync.last=Date.now();
    syncing=false;persist(true);if(S.atHome)home();if(manual)toast('Everything is up to date.');
  }catch(e){syncing=false;paintSync();if(manual)toast('Could not sync: '+(e.message||e),1);}
}
function nav(id){S.atHome=false;document.querySelectorAll('.top nav button').forEach(b=>b.classList.toggle('on',b.id==='nav-'+id));stopCam();S.review=null;window.scrollTo(0,0);}
const fmtDate=d=>{if(!d)return'';const x=new Date(d+'T00:00:00');return isNaN(x)?d:x.toLocaleDateString('en-PH',{year:'numeric',month:'long',day:'numeric'});};
const pct=(a,b)=>b?a/b*100:0;
const f1=x=>(Math.round(x*10)/10).toFixed(1);
const f2=x=>(Math.round(x*100)/100).toFixed(2);

/* ------------------------------- Home ------------------------------- */
/* ----------------------------- Graphics ----------------------------- */
const TONES=['#D4452F','#1F8A5B','#C98A0B','#2F5D9B','#7A4E9E','#1E8A8A'];
function tone(t){let h=0;for(const c of String(t||''))h=(h*31+c.charCodeAt(0))>>>0;return TONES[h%TONES.length];}
const ico=d=>`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON={
  setup:'<path d="M9 4h6v3H9z"/><path d="M9 5H5v15h14V5h-4"/><path d="M9 13l2 2 4-4"/>',
  print:'<path d="M7 8V4h10v4"/><path d="M7 17H4v-7h16v7h-3"/><path d="M7 14h10v6H7z"/>',
  scan:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  chart:'<path d="M3 20h18"/><path d="M6 20v-9"/><path d="M12 20V5"/><path d="M18 20v-6"/>',
  people:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.8a3.5 3.5 0 010 6.4"/><path d="M18.5 14.8c1.7.8 2.7 2.5 3 5.2"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>'
};
function artHero(){
  const fill=[1,3,0,2,1,3,2];let rows='';
  for(let i=0;i<7;i++){const y=70+i*17;rows+=`<rect x="54" y="${y-2.5}" width="9" height="5" rx="2.5" fill="#C9C2B0"/>`;
    for(let o=0;o<4;o++)rows+=`<circle cx="${80+o*21}" cy="${y}" r="6" fill="${fill[i]===o?'#17233A':'#fff'}" stroke="#17233A" stroke-width="1.6"/>`;}
  let mini='';
  for(let i=0;i<5;i++)for(let o=0;o<4;o++){const on=[2,0,3,1,2][i]===o,ok=i!==3;
    mini+=`<circle cx="${191+o*15}" cy="${66+i*15}" r="4.2" fill="${on?'#fff':'none'}" stroke="rgba(255,255,255,.55)" stroke-width="1.2"/>`+(on?`<circle cx="${191+o*15}" cy="${66+i*15}" r="7" fill="none" stroke="${ok?'#3DDC97':'#FF8A73'}" stroke-width="2"/>`:'');}
  return `<svg class="art" viewBox="0 0 310 232" role="img" aria-label="A phone scanning a bubble answer sheet">
    <ellipse cx="150" cy="218" rx="120" ry="9" fill="rgba(0,0,0,.25)"/>
    <g transform="rotate(-7 115 120)"><rect x="38" y="24" width="152" height="184" rx="9" fill="#FFFDF8"/>
      <rect x="46" y="32" width="9" height="9" fill="#17233A"/><rect x="173" y="32" width="9" height="9" fill="#17233A"/><rect x="46" y="191" width="9" height="9" fill="#17233A"/><rect x="173" y="191" width="9" height="9" fill="#17233A"/>
      <rect x="64" y="34" width="84" height="6" rx="3" fill="#17233A"/><rect x="64" y="45" width="56" height="4" rx="2" fill="#C9C2B0"/>${rows}</g>
    <g transform="rotate(9 220 118)"><rect x="170" y="30" width="100" height="172" rx="16" fill="#0E1626" stroke="#fff" stroke-width="3"/>

var SHEET={W:210,H:297,MK:[[12,12],[198,12],[12,285],[198,285]],MS:7};
function layout(n,opts){
  var r=2.4,cols=Math.ceil(n/25),per=Math.ceil(n/cols),colW=12+opts*6.6+3,x0=(SHEET.W-cols*colW)/2+1.5;

    for(o=0;o<opts;o++)row.push({x:x0+c*colW+12+o*6.6,y:cy});

  for(d=0;d<10;d++){id[0].push({x:76+d*6.6,y:74});id[1].push({x:76+d*6.6,y:81.2});}
  return {r:r,items:items,num:num,id:id};
}
function binarize(g,W,H){
  var S=new Uint32Array((W+1)*(H+1)),x,y,rs,W1=W+1;
  for(y=0;y<H;y++){rs=0;for(x=0;x<W;x++){rs+=g[y*W+x];S[(y+1)*W1+x+1]=S[y*W1+x+1]+rs;}}
  var half=Math.max(6,Math.round(Math.min(W,H)/14)),out=new Uint8Array(W*H);
  for(y=0;y<H;y++){var y1=y-half<0?0:y-half,y2=y+half>=H?H-1:y+half;
    for(x=0;x<W;x++){var x1=x-half<0?0:x-half,x2=x+half>=W?W-1:x+half;
      var cnt=(x2-x1+1)*(y2-y1+1),sum=S[(y2+1)*W1+x2+1]-S[y1*W1+x2+1]-S[(y2+1)*W1+x1]+S[y1*W1+x1];
      if(g[y*W+x]*cnt<sum*0.80)out[y*W+x]=1;}}
  return out;
}
function findMarkers(bin,W,H){
  var seen=new Uint8Array(W*H),stack=new Int32Array(W*H),ref=Math.min(W,H),lo=ref*0.011,hi=ref*0.075,cand=[],p,q,sp;
  for(p=0;p<W*H;p++){

    var minx=W,maxx=0,miny=H,maxy=0,area=0,sx=0,sy=0;
    while(sp){q=stack[--sp];var x=q%W,y=(q-x)/W;area++;sx+=x;sy+=y;
      if(x<minx)minx=x;if(x>maxx)maxx=x;if(y<miny)miny=y;if(y>maxy)maxy=y;
      if(x>0&&bin[q-1]&&!seen[q-1]){seen[q-1]=1;stack[sp++]=q-1;}
      if(x<W-1&&bin[q+1]&&!seen[q+1]){seen[q+1]=1;stack[sp++]=q+1;}
      if(y>0&&bin[q-W]&&!seen[q-W]){seen[q-W]=1;stack[sp++]=q-W;}
      if(y<H-1&&bin[q+W]&&!seen[q+W]){seen[q+W]=1;stack[sp++]=q+W;}}
    var bw=maxx-minx+1,bh=maxy-miny+1;
    if(bw<lo||bh<lo||bw>hi||bh>hi)continue;
    var asp=bw/bh;if(asp<0.6||asp>1.67)continue;
    if(area/(bw*bh)<0.62)continue;
    cand.push({x:sx/area,y:sy/area,a:area});
  }
  if(cand.length<4)return null;
  var corners=[[0,0],[W,0],[0,H],[W,H]],pick=[],used={},k,i;
  for(k=0;k<4;k++){var best=-1,bd=1e18;
    for(i=0;i<cand.length;i++){if(used[i])continue;var dx=cand[i].x-corners[k][0],dy=cand[i].y-corners[k][1],d=dx*dx+dy*dy;if(d<bd){bd=d;best=i;}}
    if(best<0)return null;used[best]=1;pick.push(cand[best]);}
  var dist=function(a,b){return Math.sqrt((a.x-b.x)*(a.x-b.x)+(a.y-b.y)*(a.y-b.y));};
  var wT=dist(pick[0],pick[1]),wB=dist(pick[2],pick[3]),hL=dist(pick[0],pick[2]),hR=dist(pick[1],pick[3]);
  var ratio=(hL+hR)/(wT+wB);                       // true sheet ratio is 273/186 = 1.47
  if(ratio<1.12||ratio>1.85)return null;
  if(wT/wB<0.6||wT/wB>1.67||hL/hR<0.6||hL/hR>1.67)return null;
  var as=pick.map(function(c){return c.a;});
  if(Math.max.apply(null,as)/Math.min.apply(null,as)>4)return null;
  if(pick[0].x>=pick[1].x||pick[2].x>=pick[3].x||pick[0].y>=pick[2].y||pick[1].y>=pick[3].y)return null;
  return pick;
}
function solveH(src,dst){            // maps src[i] -> dst[i]; 4 point pairs
  var A=[],i,j,k;
  for(i=0;i<4;i++){var x=src[i][0],y=src[i][1],u=dst[i][0],v=dst[i][1];
    A.push([x,y,1,0,0,0,-u*x,-u*y,u]);A.push([0,0,0,x,y,1,-v*x,-v*y,v]);}
  for(i=0;i<8;i++){var m=i;for(j=i+1;j<8;j++)if(Math.abs(A[j][i])>Math.abs(A[m][i]))m=j;
    var t=A[i];A[i]=A[m];A[m]=t;if(Math.abs(A[i][i])<1e-12)return null;
    for(j=0;j<8;j++){if(j===i)continue;var f=A[j][i]/A[i][i];for(k=i;k<9;k++)A[j][k]-=f*A[i][k];}}
  var h=[];for(i=0;i<8;i++)h.push(A[i][8]/A[i][i]);
  return function(x,y){var w=h[6]*x+h[7]*y+1;return [(h[0]*x+h[1]*y+h[2])/w,(h[3]*x+h[4]*y+h[5])/w];};

function fillOf(bin,W,H,map,b,r){

  for(dy=-R;dy<=R;dy++)for(dx=-R;dx<=R;dx++){if(dx*dx+dy*dy>rad*rad)continue;var x=cx+dx,y=cy+dy;if(x<0||y<0||x>=W||y>=H)continue;n++;if(bin[y*W+x])dark++;}

}
function decide(f){                  // -> option index, -1 blank, -2 more than one shaded
  var b=-1,s=-1,i;
  for(i=0;i<f.length;i++){if(b<0||f[i]>f[b]){s=b;b=i;}else if(s<0||f[i]>f[s])s=i;}
  if(f[b]<0.42)return -1;
  if(s>=0&&f[s]>=0.42&&f[s]>=f[b]*0.72)return -2;
  return b;
}
function readSheet(g,W,H,n,opts){
  var bin=binarize(g,W,H),mk=findMarkers(bin,W,H);
  if(!mk)return {ok:false,err:'Looking for the four black corner squares… keep the whole sheet inside the frame, flat and upright.'};
  var map=solveH(SHEET.MK,mk.map(function(m){return [m.x,m.y];}));
  if(!map)return {ok:false,err:'Could not align the sheet. Try again.'};
  var L=layout(n,opts),ans=[],i,o;
  for(i=0;i<n;i++){var f=[];for(o=0;o<opts;o++)f.push(fillOf(bin,W,H,map,L.items[i][o],L.r));
    var d=decide(f);ans.push(d===-1?'_':d===-2?'*':'ABCDE'.charAt(d));}
  var t=decide(L.id[0].map(function(b){return fillOf(bin,W,H,map,b,L.r);})),u=decide(L.id[1].map(function(b){return fillOf(bin,W,H,map,b,L.r);}));
  return {ok:true,answers:ans,studentNo:(t>=0&&u>=0)?''+t+u:'',map:map,L:L};
}

function grab(src,sw,sh,max){
  const k=Math.min(1,max/Math.max(sw,sh)),W=Math.round(sw*k),H=Math.round(sh*k);
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,W,H);
  const d=x.getImageData(0,0,W,H).data,g=new Uint8Array(W*H);
  for(let i=0,j=0;i<g.length;i++,j+=4)g[i]=(d[j]*77+d[j+1]*150+d[j+2]*29)>>8;
  const r=readSheet(g,W,H,E.items,E.options);r.base=c;return r;
}
function tick(){

function mastery(m){return m>=96?'Mastered':m>=86?'Closely Approximating Mastery':m>=66?'Moving Towards Mastery':m>=35?'Average Mastery':m>=15?'Low Mastery':m>=5?'Very Low Mastery':'Absolutely No Mastery';}

function discLabel(d){return d>=0.40?'Very Good':d>=0.30?'Good':d>=0.20?'Marginal':'Poor';}
function analyze(X,rows){
  const n=X.items,N=rows.length,key=X.key,sc=rows.map(r=>score(r.answers,key));
  const order=rows.map((_,i)=>i).sort((a,b)=>sc[b]-sc[a]),g=Math.max(1,Math.round(N*0.27));
  const up=order.slice(0,g),lo=order.slice(-g),items=[];
  for(let i=0;i<n;i++){
    const cnt={};rows.forEach(r=>{const a=r.answers[i]||'_';cnt[a]=(cnt[a]||0)+1;});
    const k=key[i],correct=k==='_'?0:(cnt[k]||0),p=N?correct/N:0;
    const U=up.filter(j=>rows[j].answers[i]===k).length,Lw=lo.filter(j=>rows[j].answers[i]===k).length,Dx=(U-Lw)/g;
    let wrong='',wn=0;LET.slice(0,X.options).split('').forEach(o=>{if(o!==k&&(cnt[o]||0)>wn){wn=cnt[o];wrong=o;}});
    const useD=N>=10;
    const decision=!useD?(p<0.21||p>0.9?'Revise':'Retain'):(Dx<0.2&&p<0.21?'Reject':Dx<0.2||p<0.21||p>0.9?'Revise':'Retain');
    items.push({no:i+1,key:k,cnt,correct,p,D:Dx,useD,wrong,wn,decision});
  }
  const mean=N?sc.reduce((a,b)=>a+b,0)/N:0,sd=N?Math.sqrt(sc.reduce((a,b)=>a+(b-mean)*(b-mean),0)/N):0;
  const comps=(X.tos||[]).map((t,ti)=>{const its=parseItems(t.items,n);if(!its.length)return null;
    const correct=its.reduce((a,i)=>a+items[i-1].correct,0),mps=pct(correct,N*its.length);
    const weak=rows.filter(r=>its.filter(i=>key[i-1]!=='_'&&r.answers[i-1]===key[i-1]).length/its.length<0.5).map(r=>r.name||('No. '+r.studentNo));
    return {ti,code:t.code,competency:t.competency,its,mps,level:mastery(mps),weak};}).filter(Boolean);
  const ranked=comps.slice().sort((a,b)=>a.mps-b.mps);ranked.forEach((c,i)=>c.rank=i+1);
  let least=ranked.filter(c=>c.mps<X.threshold);const below=least.length>0;
  if(!below)least=ranked.slice(0,Math.min(3,ranked.length));
  return {N,n,sc,items,mean,sd,mps:pct(mean,n),max:N?Math.max(...sc):0,min:N?Math.min(...sc):0,passed:sc.filter(s=>pct(s,n)>=X.threshold).length,comps,ranked,least,below};
}
function intervention(X,A,c){
  const saved=(X.iv||{})[c.ti]||{};
  const hard=c.its.map(i=>A.items[i-1]).sort((a,b)=>a.p-b.p).slice(0,3);
  const ev=hard.map(it=>`Item ${it.no}: ${Math.round(it.p*100)}% correct`+(it.wn?`; ${Math.round(it.wn/A.N*100)}% chose ${it.wrong} instead of ${it.key}`:'')).join('\n');
  const mis=hard.filter(it=>it.wn/A.N>=0.3).map(it=>`item ${it.no} (option ${it.wrong})`);
  const flawed=hard.filter(it=>it.decision!=='Retain'&&it.p<0.21).map(it=>it.no);
  let tier,st,tl,who;
  if(c.mps<35){tier='Intensive reteaching';tl='2 weeks';who='Subject teacher, with technical assistance from the Master Teacher';
    st=['Reteach the competency starting from its prerequisite skills, using explicit instruction and worked examples.','Hold small-group remediation sessions (2–3 sessions) using contextualized learning activity sheets.','Give a short formative check (3–5 items) after every session with immediate feedback.'];}
  else if(c.mps<66){tier='Targeted remediation';tl='1 week';who='Subject teacher';
    st=['Re-discuss the specific part of the lesson where most errors occurred.','Pair the learners listed with classmates who mastered the competency for peer tutoring.','Provide guided practice through a strategic intervention material or learning activity sheet.'];}
  else{tier='Reinforcement';tl='2–3 days';who='Subject teacher';
    st=['Do a brief review and error analysis of the missed items in class.','Assign additional practice exercises on the competency.','Include spiral review items on this competency in the next quizzes.'];}
  if(mis.length)st.push('Address the misconception behind the most-chosen wrong answer in '+mis.join(', ')+'.');
  if(flawed.length)st.push('Review the wording and key of item '+flawed.join(', ')+' before reteaching — the item itself may be flawed.');
  return {tier,ev,
    s:saved.s||st.map(x=>'• '+x).join('\n'),t:saved.t||tl,r:saved.r||who,
    k:saved.k||`At least ${X.threshold}% MPS on a parallel reassessment of this competency.`,
    learners:c.weak.length?`${c.weak.length} learner(s) below 50% on these items: ${c.weak.join('; ')}`:'No learner scored below 50% on these items.'};
}

    <div class="card"><h3>Competency mastery (from the Table of Specifications)</h3>${tosWarn}
      ${A.comps.length?`<table><thead><tr><th>Code</th><th>Learning competency</th><th>Items</th><th class="c">MPS</th><th class="noprint"></th><th>Mastery level</th><th class="c">Rank<br>(1 = least learned)</th></tr></thead><tbody>
      ${A.comps.map(c=>`<tr><td>${esc(c.code)}</td><td>${esc(c.competency)}</td><td>${ranges(c.its)}</td><td class="c"><b>${f1(c.mps)}%</b></td><td class="noprint"><div class="bar"><i style="width:${c.mps}%;background:${col(c.mps)}"></i></div></td><td>${c.level}</td><td class="c">${c.rank}</td></tr>`).join('')}</tbody></table>`:''}</div>
    ${A.comps.length?`<div class="card"><h3>Least learned competencies and intervention plan</h3>
      <p class="muted">${A.below?`${A.least.length} competenc${A.least.length>1?'ies':'y'} fell below the ${E.threshold}% mastery target.`:`All competencies met the ${E.threshold}% target. The lowest ones are listed for reinforcement.`} <span class="noprint">Yellow cells can be edited — your changes are saved with the exam. <a href="#" onclick="resetIv();return false">Reset to suggested plan</a></span></p>
      <div style="overflow:auto"><table><thead><tr><th style="width:17%">Least learned competency</th><th class="c">MPS</th><th style="width:17%">Evidence from the items</th><th>Intervention</th><th style="width:16%">Learners for intervention</th><th>Timeline</th><th>Person responsible</th><th>Success indicator</th></tr></thead><tbody>
      ${A.least.map(c=>{const v=intervention(E,A,c),ed=(f,val)=>`<td contenteditable="true" style="white-space:pre-wrap" onblur="ivEdit(${c.ti},'${f}',this.innerText)">${esc(val)}</td>`;
        return`<tr><td><b>${esc(c.code)}</b> ${esc(c.competency)}<br><span class="muted">Items ${ranges(c.its)}</span></td><td class="c"><b>${f1(c.mps)}%</b><br>${c.level}</td><td style="white-space:pre-wrap">${esc(v.ev)}</td>
        <td contenteditable="true" style="white-space:pre-wrap" onblur="ivEdit(${c.ti},'s',this.innerText)"><b>${v.tier}</b>\n${esc(v.s)}</td><td>${esc(v.learners)}</td>${ed('t',v.t)}${ed('r',v.r)}${ed('k',v.k)}</tr>`;}).join('')}
      </tbody></table></div></div>`:''}
    <div class="card"><h3>Item analysis</h3><div style="overflow:auto"><table><thead><tr><th class="c">Item</th><th class="c">Key</th>${LET.slice(0,E.options).split('').map(o=>`<th class="c">${o}</th>`).join('')}<th class="c">Blank /<br>2+</th><th class="c">Correct</th><th class="c">% Correct</th><th class="c">Difficulty<br>index</th><th>Difficulty</th><th class="c">Discrimination<br>index</th><th>Discrimination</th><th>Decision</th></tr></thead><tbody>
      ${A.items.map(it=>`<tr><td class="c"><b>${it.no}</b></td><td class="c">${it.key==='_'?'—':it.key}</td>${LET.slice(0,E.options).split('').map(o=>`<td class="c" ${o===it.key?'style="font-weight:700;background:#DDF1E7"':''}>${it.cnt[o]||0}</td>`).join('')}<td class="c">${(it.cnt._||0)+(it.cnt['*']||0)}</td><td class="c">${it.correct}</td><td class="c">${Math.round(it.p*100)}%</td><td class="c">${f2(it.p)}</td><td>${diffLabel(it.p)}</td><td class="c">${it.useD?f2(it.D):'—'}</td><td>${it.useD?discLabel(it.D):'—'}</td><td>${it.decision}</td></tr>`).join('')}
      </tbody></table></div><p class="muted" style="margin-bottom:0">Difficulty index = proportion who answered correctly. Discrimination index compares the upper and lower 27% of examinees${A.N<10?' and is shown once there are at least 10 examinees':''}.</p></div>
    <div class="card"><div class="sign">
      ${sign('Prepared by:',E.teacher,'Subject Teacher')}
      ${(mts.length?mts:['']).map((m,i)=>sign(i?'&nbsp;':'Checked and reviewed by:',m,st.masterTeacherTitle||'Master Teacher')).join('')}
      ${sign(mts.length?'&nbsp;':'Checked and reviewed by:',st.coordinator,st.coordinatorTitle||'School Testing Coordinator')}
      ${sign('Noted:',st.principal,st.principalTitle||'School Principal')}
    </div></div>
  </div>`;
}
function ivEdit(ti,f,val){
  val=val.trim();if(f==='s')val=val.replace(/^(Intensive reteaching|Targeted remediation|Reinforcement)\s*/,'');
  E.iv=E.iv||{};E.iv[ti]=E.iv[ti]||{};if(E.iv[ti][f]===val)return;
  const cur=intervention(Object.assign({},E,{iv:{}}),S.A,S.A.comps.find(c=>c.ti===ti));
  if(!E.iv[ti][f]&&cur[f]===val)return;
  E.iv[ti][f]=val;touch(E);persist();toast('Intervention plan saved.');
}
async function resetIv(){if(!confirm('Replace your edits with the suggested plan?'))return;E.iv={};touch(E);persist();drawReport();}
function printReport(){doPrint($('#report').outerHTML,'size:A4 landscape;margin:12mm');}
async function exportReport(){
  const A=S.A,st=S.settings,L=LET.slice(0,E.options).split('');
  const blocks=[
    {title:'ITEM ANALYSIS AND LEAST LEARNED COMPETENCIES REPORT',rows:[['School',st.school],['Exam',E.title],['Subject',E.subject],['Grade / Section',E.grade+' · '+(S.fsec||'All sections')],['Teacher',E.teacher],['Date',fmtDate(E.date)],['Examinees',A.N],['Items',A.n],['Mean',f2(A.mean)],['MPS (%)',f1(A.mps)],['SD',f2(A.sd)],['Highest',A.max],['Lowest',A.min]]},
    {title:'Competency mastery',header:true,rows:[['Code','Learning competency','Items','MPS (%)','Mastery level','Rank (1 = least learned)']].concat(A.comps.map(c=>[c.code,c.competency,ranges(c.its),f1(c.mps),c.level,c.rank]))},
    {title:'Least learned competencies and intervention plan',header:true,rows:[['Competency','MPS (%)','Evidence','Intervention','Learners for intervention','Timeline','Person responsible','Success indicator']].concat(A.least.map(c=>{const v=intervention(E,A,c);return[(c.code+' '+c.competency).trim(),f1(c.mps),v.ev,v.tier+'\n'+v.s,v.learners,v.t,v.r,v.k];}))},
    {title:'Item analysis',header:true,rows:[['Item','Key'].concat(L,['Blank/2+','Correct','% Correct','Difficulty index','Difficulty','Discrimination index','Discrimination','Decision'])].concat(A.items.map(it=>[it.no,it.key].concat(L.map(o=>it.cnt[o]||0),[(it.cnt._||0)+(it.cnt['*']||0),it.correct,Math.round(it.p*100),f2(it.p),diffLabel(it.p),it.useD?f2(it.D):'',it.useD?discLabel(it.D):'',it.decision])))},
    {title:'Signatories',rows:[['Prepared by:',E.teacher,'Subject Teacher'],['Checked and reviewed by:',(st.masterTeachers||'').split(/\n|;/).map(x=>x.trim()).filter(Boolean).join(', '),st.masterTeacherTitle],['Checked and reviewed by:',st.coordinator,st.coordinatorTitle],['Noted:',st.principal,st.principalTitle]]}
  ];
  if(!DB.sync.url||!navigator.onLine)return toast('Exporting to Google Sheets needs internet and the sync link. You can still print the report offline.',1);
  toast('Writing the report to your Google Sheet…');let url;
  try{url=(await post({action:'export',title:E.title+(S.fsec?' '+S.fsec:''),blocks})).url;}catch(e){return toast('Could not export: '+(e.message||e),1);}
  $('#tab').insertAdjacentHTML('afterbegin',`<p><span class="pill g">Report exported.</span> <a href="${esc(url)}" target="_blank">Open it in Google Sheets ↗</a></p>`);
}

/* ------------------------------ Classes ------------------------------ */
function classes(sel){
  nav('classes');const secs=Object.keys(S.roster).sort();S._secs=secs;S._cur=sel||'';
  $('#main').innerHTML=`${banner('people','#2F5D9B','Classes',"Add a class list so SIPAT can fill in each learner's name from the student number shaded on the answer sheet.")}
    <div class="two">
      <div class="card">${secs.length?secs.map((s,i)=>`<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><a href="#" onclick="classes(S._secs[${i}]);return false"><b>${esc(s)}</b></a><span class="pill">${S.roster[s].length}</span></div>`).join(''):'<p class="muted">No classes yet.</p>'}
        <button class="btn sm" style="margin-top:12px" onclick="classes('')">＋ New class</button></div>
      <div class="card"><div style="max-width:320px"><label>Section name</label><input id="clsName" value="${esc(sel||'')}" placeholder="e.g. 11 – Rizal"></div>
        <label style="margin-top:12px">Learners — one name per line, in class-number order (line 1 = student no. 01)</label>
        <textarea id="clsNames" rows="16" placeholder="Dela Cruz, Juan A.&#10;Santos, Maria B.">${esc((S.roster[sel]||[]).map(p=>p.name).join('\n'))}</textarea>
        <div class="row" style="margin-top:12px"><button class="btn pri" onclick="saveClass()">Save class</button>${sel?`<button class="btn ghost" onclick="delClass(S._cur)">Delete class</button>`:''}</div></div>
    </div>`;
}
async function saveClass(){
  const n=$('#clsName').value.trim(),names=$('#clsNames').value.split('\n').map(x=>x.trim()).filter(Boolean);
  if(!n||!names.length)return toast('Enter the section name and at least one learner.',1);
  if(names.length>99)return toast('A class can have up to 99 learners.',1);
  let c=DB.classes.find(x=>x.section===n);if(!c){c={section:n};DB.classes.push(c);}c.names=names;delete c.deleted;touch(c);persist();toast('Class saved.');classes(n);
}
async function delClass(n){if(!confirm('Delete the class list for '+n+'? Scanned results are kept.'))return;const c=DB.classes.find(x=>x.section===n);if(c)touch(c).deleted=1;persist();classes();}

/* ------------------------------ Settings ------------------------------ */
function settings(){
  nav('settings');const st=S.settings;
  const inp=(k,l,ph='')=>`<div><label>${l}</label><input data-k="${k}" value="${esc(st[k])}" placeholder="${ph}"></div>`;
  $('#main').innerHTML=`${banner('gear','#7A4E9E','Settings','Sync, terms and types of test, school details and report signatories.')}
    <div class="card"><h3>Sync with the school's Google Sheet</h3><p class="muted" style="margin-top:-6px">SIPAT keeps everything on this phone and uploads it whenever there is internet. Paste the web app link from the school's SIPAT Google Sheet (it ends in <b>/exec</b>) and the school passcode.</p>
      <div class="form"><div style="grid-column:1/-1;max-width:640px"><label>Sync link</label><input id="syUrl" value="${esc(DB.sync.url)}" placeholder="https://script.google.com/macros/s/…/exec"></div><div><label>School passcode</label><input id="syCode" value="${esc(DB.sync.code)}"></div></div>
      <p class="muted" style="margin-bottom:0">${DB.sync.last?'Last synced: '+new Date(DB.sync.last).toLocaleString():'Not synced yet.'} · ${pending()} change(s) waiting to upload.</p></div>
    <div class="card"><h3>School</h3><div class="form">${inp('region','Region','Region XI')}${inp('division','Schools Division','Schools Division of …')}${inp('school','School')}${inp('schoolYear','School year','2026–2027')}</div></div>
    <div class="card"><h3>Terms and types of test</h3><p class="muted" style="margin-top:-6px">These are the choices teachers see when creating an exam. One per line — add, rename or remove to match what your school uses.</p>
      <div style="max-width:420px"><textarea data-k="periods" rows="8">${esc(periods().join('\n'))}</textarea></div></div>
    <div class="card"><h3>Report signatories</h3><p class="muted" style="margin-top:-6px">The subject teacher of each exam signs as “Prepared by”.</p><div class="form">
      <div style="grid-column:1/-1;max-width:520px"><label>Master Teacher(s) — one per line (Checked and reviewed by)</label><textarea data-k="masterTeachers" rows="3">${esc(st.masterTeachers)}</textarea></div>
      ${inp('masterTeacherTitle','Master Teacher position title')}${inp('coordinator','School Testing Coordinator')}${inp('coordinatorTitle','Coordinator position title')}${inp('principal','School Principal (Noted)')}${inp('principalTitle','Principal position title')}</div></div>
    <button class="btn pri" onclick="saveSet()">Save</button>`;
}
function saveSet(){document.querySelectorAll('[data-k]').forEach(e=>DB.settings[e.dataset.k]=e.value.trim());touch(DB.settings);DB.sync.url=$('#syUrl').value.trim();DB.sync.code=$('#syCode').value.trim();persist(true);toast('Saved.');if(DB.sync.url)sync(true);}

/* -------------------------------- Boot -------------------------------- */
if(typeof localStorage!=='undefined'){
  DB=loadDB();refresh();home();paintSync();
  addEventListener('online',()=>{paintSync();sync(false);});addEventListener('offline',paintSync);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  sync(false);
}
</script>
</body>
</html>
